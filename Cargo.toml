[workspace]
members = ["crates/searchcord-parity", "crates/searchcord-archive", "crates/searchcord-snapshot", "crates/searchcord-viewer"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "functions", "hooks"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tempfile = "=3.23.0"
flate2 = "=1.1.5"
sha2 = "=0.10.9"
chrono = { version = "=0.4.42", default-features = false, features = ["std", "clock", "serde"] }
url = "=2.5.8"
unicode-normalization = "=0.1.22"
ctrlc = "=3.5.0"
axum = "=0.8.6"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "=0.6.11", features = ["fs", "compression-gzip"] }
percent-encoding = "=2.3.2"
tower = { version = "=0.5.3", features = ["util"] }
