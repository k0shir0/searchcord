[workspace]
members = ["crates/searchcord-parity", "crates/searchcord-archive"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "functions", "hooks"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tempfile = "=3.23.0"
flate2 = "=1.1.5"
sha2 = "=0.10.9"
