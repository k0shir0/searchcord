<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Search your local Discord archive.">
  <title>searchcord</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../bauhaus.css">
  <link rel="stylesheet" href="search.css">
  <script src="search.js" defer></script>
</head>
<body>
  <a class="skip" href="#searchInput">Skip to search</a>
  <header class="masthead"><h1>search<span>cord</span></h1></header>
  <main>
    <section class="search-surface" aria-labelledby="searchTitle">
      <div class="geometry" aria-hidden="true">
        <svg viewBox="0 0 440 250" fill="none">
          <g class="grid-lines"><path d="M0 55H440M0 125H440M0 195H440M60 0V250M170 0V250M280 0V250M390 0V250"/></g>
          <g class="clearance"><path d="M70 91 136 211H4Z"/><rect x="319" y="174" width="54" height="54"/></g>
          <circle class="ring gap" cx="284" cy="98" r="72"/>
          <circle class="ring" cx="284" cy="98" r="72"/>
          <path class="triangle" d="M70 91 136 211H4Z"/>
          <rect class="square" x="319" y="174" width="54" height="54"/>
        </svg>
      </div>
      <div class="search-heading"><h2 id="searchTitle">What are you<br>looking for?</h2></div>
      <form id="searchForm" role="search" autocomplete="off">
        <label class="sr-only" for="searchInput">Search messages</label>
        <div class="query-form">
          <input id="searchInput" name="q" type="search" maxlength="200" placeholder="try “release notes”" aria-describedby="searchError" aria-controls="filterTray" aria-expanded="false">
          <button type="submit">search</button>
        </div>
        <div id="filterTray" class="filter-tray" inert>
          <div class="filter-form">
            <label>server<input id="guild" list="guildOptions" placeholder="server name" data-kind="server" data-param="guild_id"><datalist id="guildOptions"></datalist></label>
            <label>channel<input id="channel" list="channelOptions" placeholder="channel name" data-kind="channel" data-param="channel_id"><datalist id="channelOptions"></datalist></label>
            <label>author<input id="author" list="authorOptions" placeholder="user name" data-kind="author" data-param="author_id"><datalist id="authorOptions"></datalist></label>
            <label>from<input id="dateFrom" type="date" name="date_from" title="From date (UTC)"></label>
            <label>to<input id="dateTo" type="date" name="date_to" title="To date (UTC, inclusive)"></label>
            <button id="clearFilters" type="button">clear filters</button>
          </div>
          <span id="suggestionStatus" role="status"></span>
        </div>
        <p id="searchError" class="error" role="alert" hidden></p>
      </form>
    </section>
    <div class="index-block" aria-label="Archive totals"><div class="index-stat"><span class="index-number" id="messageTotal">…</span><span class="index-caption">messages indexed</span></div><div class="index-stat"><span class="index-number" id="serverTotal">…</span><span class="index-caption">indexed servers</span></div></div>
    <p id="archiveError" class="error" role="alert" hidden></p>
    <section id="results" class="results" aria-labelledby="resultsTitle" hidden>
      <div class="results-heading"><h2 id="resultsTitle" tabindex="-1">results</h2><p class="sr-only" id="resultStatus" role="status" aria-live="polite"></p></div>
      <div id="resultBody" aria-busy="false"><div id="messages" class="result-list"></div><div id="emptyState" class="empty-state" hidden><h3>No messages found.</h3><p>Try a shorter phrase or remove a filter.</p><button id="editSearch" type="button">Edit search <span aria-hidden="true">↑</span></button></div></div>
      <nav id="pagination" class="pagination" aria-label="Result pages" hidden><button id="previousPage" class="page-control" type="button">previous</button><span id="pageNumber" class="page-readout page-current"></span><button id="nextPage" class="page-control" type="button">next</button></nav>
    </section>
  </main>
  <footer class="site-footer"><a href="privacy.html">privacy &amp; data</a></footer>
</body>
</html>
