name: PR tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Windows regression tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SEARCHCORD_DATA_DIR: ${{ runner.temp }}/searchcord-tests
      SEARCHCORD_CREDENTIAL_FILE: ${{ runner.temp }}/searchcord-tests/credentials.vault
      SEARCHCORD_CREDENTIAL_KEY_FILE: ${{ runner.temp }}/searchcord-tests/credentials.key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Python runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Python regression tests
        run: python -m unittest discover -s tests -t . -v
      - name: Browser queue regression tests
        run: node --test tests/test_collection_queue.mjs
      - name: JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem static -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
