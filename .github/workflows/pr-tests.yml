name: PR tests

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-tests.yml'
      - '*.py'
      - 'requirements*.txt'
      - 'static/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  regression:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: Windows regression tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SEARCHCORD_DATA_DIR: ${{ github.workspace }}/.ci-data
      SEARCHCORD_CREDENTIAL_FILE: ${{ github.workspace }}/.ci-data/credentials.vault
      SEARCHCORD_CREDENTIAL_KEY_FILE: ${{ github.workspace }}/.ci-data/credentials.key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install Python reference dependencies
        run: python -m pip install -r requirements-parity.txt
      - name: Python regression tests
        run: python -m unittest discover -s tests -t . -v
      - name: Browser queue regression tests
        run: node --test tests/test_collection_queue.mjs
      - name: JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem static -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
