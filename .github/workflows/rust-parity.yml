name: Rust migration parity

on:
  pull_request:
    branches: [main, rewrite/rust]
  push:
    branches: [main, rewrite/rust]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Publish from main with these release notes. Leave blank to run checks only.'
        type: string

permissions:
  contents: read

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SEARCHCORD_DATA_DIR: ${{ github.workspace }}/.ci-data
      SEARCHCORD_CREDENTIAL_FILE: ${{ github.workspace }}/.ci-secrets/credentials.vault
      SEARCHCORD_CREDENTIAL_KEY_FILE: ${{ github.workspace }}/.ci-secrets/credentials.key
      SEARCHCORD_PARITY_BACKEND: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-parity.txt
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install pinned browser and WebDriver
        run: python crates/searchcord-parity/driver/install_webdriver.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Native viewer HTTP contracts
        run: cargo test --locked -p searchcord-parity --test search_display
        env:
          SEARCHCORD_PARITY_BACKEND: rust
      - name: Native collector and viewer browser
        run: cargo test --locked -p searchcord-parity --test browser
        env:
          SEARCHCORD_PARITY_BACKEND: rust
      - name: Static Linux viewer package and scratch image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          RUSTFLAGS='-C target-feature=+crt-static' cargo build --release --locked --target x86_64-unknown-linux-gnu -p searchcord-viewer
          target/x86_64-unknown-linux-gnu/release/searchcord-package-search .native-viewer
          docker build -t searchcord-native-check .native-viewer
          docker run --rm searchcord-native-check --help
          trap 'docker rm -f searchcord-native-http >/dev/null' EXIT
          docker run --rm -d --name searchcord-native-http -p 127.0.0.1:8001:8001 searchcord-native-check
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8001/ -o .native-viewer-index.html
          cmp .native-viewer-index.html .native-viewer/static/search/index.html
      - run: python -m unittest discover -s tests -t . -v
      - run: node --test tests/test_collection_queue.mjs
      - name: JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem static -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build native applications
        run: cargo build --release --locked -p searchcord-collector -p searchcord-viewer -p searchcord-snapshot
      - name: Prepare native application package
        shell: pwsh
        run: |
          ./deploy/native/package.ps1 -OutputDirectory native-packages -Architecture '${{ runner.arch }}'
          $binarySuffix = if ($IsWindows) { '.exe' } else { '' }
          $env:SEARCHCORD_NATIVE_COLLECTOR = Join-Path $PWD "target/release/searchcord$binarySuffix"
          cargo test --locked -p searchcord-collector --test startup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: searchcord-${{ runner.os }}-${{ runner.arch }}
          path: native-packages/searchcord-*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_notes != ''
    needs: parity
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: publish-searchcord-release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: searchcord-*
          path: packages
          merge-multiple: true
      - name: Publish the verified packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          shopt -s nullglob
          windows=(packages/searchcord-Windows-X64.zip)
          linux=(packages/searchcord-Linux-*.tar.gz)
          macos=(packages/searchcord-macOS-*.tar.gz)
          [[ ${#linux[@]} == 1 && ${#macos[@]} == 1 && -n "${RELEASE_NOTES//[[:space:]]/}" ]]
          version=$(unzip -p "${windows[0]}" .searchcord-version | tr -d '\r')
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          refs=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$tag" "refs/tags/$tag^{}")
          if [[ -n $refs && $(printf '%s\n' "$refs" | tail -1 | cut -f1) != "$GITHUB_SHA" ]]; then
            echo "$tag already points to a different commit."
            exit 1
          fi
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" "${windows[@]}" "${linux[@]}" "${macos[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Searchcord $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
