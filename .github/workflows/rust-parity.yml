name: Rust migration parity

on:
  pull_request:
    branches: [rewrite/rust]
  push:
    branches: [rewrite/rust, 'rewrite/rust-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SEARCHCORD_DATA_DIR: ${{ github.workspace }}/.ci-data
      SEARCHCORD_CREDENTIAL_FILE: ${{ github.workspace }}/.ci-secrets/credentials.vault
      SEARCHCORD_CREDENTIAL_KEY_FILE: ${{ github.workspace }}/.ci-secrets/credentials.key
      SEARCHCORD_PARITY_BACKEND: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-parity.txt
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install pinned browser and WebDriver
        run: python crates/searchcord-parity/driver/install_webdriver.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Native viewer HTTP contracts
        run: cargo test --locked -p searchcord-parity --test search_display
        env:
          SEARCHCORD_PARITY_BACKEND: rust
      - name: Native viewer browser
        run: cargo test --locked -p searchcord-parity --test browser unchanged_viewer
        env:
          SEARCHCORD_PARITY_BACKEND: rust
      - run: python -m unittest discover -s tests -t . -v
      - run: node --test tests/test_collection_queue.mjs
      - name: JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem static -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
